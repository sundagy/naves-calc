[project]
name = "naves-calc"
version = "0.1.0"
description = "Parametric FEM canopy calculator"
readme = "Project.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.22",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "streamlit>=1.36",
    "openseespy>=3.7.1",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

