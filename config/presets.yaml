naves_one:
  width: 12.0
  left_depth: 9.659
  right_depth: 7.030
  lower_count: 5
  lower_positions_x: null
  upper_count: 10
  lower_height_mm: 700
  upper_height_mm: 400
  upper_end_height_mm: 170
  upper_max_diagonal_mm: 800
  front_left_height: 3.801
  front_right_height: 3.600
  rear_left_height: 3.801
  lower_chord_section: "60x60x3"
  lower_web_section: "60x60x3"
  upper_chord_section: "60x60x3"
  upper_web_section: "40x40x3"
  column_section: "120x120x3"
  column_height_mm: 2700
  support_mode: CUSTOM
  base_fixity: FIXED
  fixed_base_hypothesis_accepted: true
  spatial_frame: true
  roof_system: MEMBRANE
  roof_load_confirmed: false
  steel_grade: "UNKNOWN"
  project_notes:
    foundation_assumption: "Для предварительного расчёта металлокаркаса заказчиком принята гипотеза жёсткой заделки оснований всех 12 стоек: три перемещения и три поворота запрещены. Несущая способность и реальная жёсткость свай, грунта и закладных в этой гипотезе не проверяются. Гипотеза не задаёт жёсткость надземных соединений."
    location: "Калуга; отдельно стоящий навес."
    construction_status: "Строительство ещё не началось, планируется в ближайшее время. Рабочее решение пространственной устойчивости и оснований не подтверждено."
    surroundings: "Забор 2 м со стороны front; расстояние до забора не указано. Схода снега на кровлю, парапетов и снегозадержателей не будет."
    steel: "Предположительно Ст3сп со слов заказчика; марка и прочность документально не подтверждены. Ry=245 МПа оставлено только как условное расчётное допущение."
    bracing: "Диагоналей между стойками и подкосов от стоек к фермам нет. B1 и B2 сходятся у K1-rear; это уже учтено геометрией. Отдельные диагональные связи в плоскости кровли не подтверждены."
    joints: "Нижние фермы непосредственно опираются на перекладины и приварены; верхние приварены к нижним; раскосы приварены прямо к поясам. Размеры швов неизвестны."
    roof: "Мембранная кровля; существующий уклон около 1,07° сохранён. Несущее основание, крепление, состав слоёв и водоотвод ещё не выбраны. В расчёте оставлена условная суммарная постоянная нагрузка 0,15 кН/м² — это не подтверждённый вес кровельной системы. Жёсткость мембраны и основания как диска не учитывается."
    frame_assumption: "Пространственная модель: основания FIXED, надземные сварные узлы идеализированы абсолютно жёсткими, в том числе соединения решётки с поясами. Искусственных опор над землёй нет. Прочность и реальная жёсткость швов не проверены."
    foundations: "Бетонные заливные сваи Ø250 мм, глубина 1700 мм. Стойки приварены к закладному швеллеру; к нему приварены 4 стержня Ø14 мм — со слов заказчика это всё армирование. Длина стержней 1500 мм; грунт — глина со слов заказчика. Бетон описан как «хорошей марки с щебнем», численный класс прочности не указан. Класс и расположение арматуры, защитный слой, швеллер, швы и расчётные характеристики грунта не уточнены. Жёсткая заделка расчётом не подтверждена."

